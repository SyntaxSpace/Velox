version: '3.8'

services:
  # ─── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velox-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://velox:velox_dev@postgres:5432/velox_dev
      - JWT_SECRET=velox-dev-jwt-secret-change-in-production
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - velox-network

  # ─── PostgreSQL Database ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: velox-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: velox
      POSTGRES_PASSWORD: velox_dev
      POSTGRES_DB: velox_dev
    volumes:
      - velox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U velox -d velox_dev']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - velox-network

  # ─── pgAdmin ───────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: velox-pgadmin
    restart: unless-stopped
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@velox.app
      PGADMIN_DEFAULT_PASSWORD: velox_admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    depends_on:
      - postgres
    networks:
      - velox-network

volumes:
  velox-postgres-data:
    driver: local

networks:
  velox-network:
    driver: bridge
